[package]
name = "wmts_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["query"] }
# tls-rustls-no-provider + 明確指定 rustls "ring" 後端：避免 tls-rustls 預設的
# aws-lc-rs 後端在建置時需要 cmake/nasm（本機工具鏈未安裝，見 ARCHITECTURE.md 第 7 節）。
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# 不啟用 "tls12" feature：需求規範明訂「服務傳輸須採用 HTTPS TLS 1.3（含）以上」，
# 拿掉這個 feature 讓 TLS 1.2 的程式碼路徑連編譯都不會編進去，比單純在執行期
# 篩選協定版本更嚴格（main.rs 另外也會在 ServerConfig 明確指定只用 TLS 1.3）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
jsonwebtoken = "9"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
thiserror = "1"
governor = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
# 選用功能 overpass（cargo build --features overpass）：DuckDB 內建編譯約 30 分鐘，HF Space 映像不需要，預設不啟用。
duckdb = { version = "1.10506", features = ["bundled"], optional = true }
# 選用功能 ingest（cargo build --features ingest）：無人機影像上傳、增量鑲嵌成圖磚（近即時正射模擬／處理）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
kamadak-exif = { version = "0.6", optional = true }
sha2 = "0.10"

[features]
overpass = ["dep:duckdb"]
ingest = ["dep:image", "dep:kamadak-exif"]
